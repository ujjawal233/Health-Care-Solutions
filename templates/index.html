{% extends 'base.html' %}

{% block title %}Book Appointment{% endblock %}
{% block content %}
<header class="mb-4">
    <h1 class="h3">Welcome to HealthCare+</h1>
    <p class="text-muted">Select a doctor and book an appointment.</p>
</header>

<form method="POST" action="{{ url_for('book') }}" class="needs-validation" novalidate>
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" required aria-required="true">
        </div>
        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required aria-required="true">
        </div>
        <div class="col-md-6">
            <label class="form-label">Specialization</label>
            <select class="form-select" id="specialization" name="specialization" required aria-label="Specialization">
                <option value="" disabled selected>Select specialization</option>
                {% for spec in specializations %}
                    <option value="{{ spec }}">{{ spec }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Doctor</label>
            <select class="form-select" name="doctor" id="doctor" required aria-label="Doctor selection">
                <option value="" disabled selected>Select specialization first</option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Location (near you)</label>
            <input type="text" class="form-control" id="location" name="location" placeholder="Type your preferred location" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" name="date" id="appt_date" required aria-label="Appointment date">
        </div>
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">Book</button>
    </div>
</form>

<script>
    const doctors = [
        {% for d in doctors %}
        { name: {{ d[0]|tojson }}, specialization: {{ d[1]|tojson }}, location: {{ d[2]|tojson }} },
        {% endfor %}
    ];

    const specializationSelect = document.getElementById('specialization');
    const doctorSelect = document.getElementById('doctor');
    const locationInput = document.getElementById('location');

    function populateDoctors() {
        const spec = specializationSelect.value;
        const location = locationInput.value.trim().toLowerCase();
        doctorSelect.innerHTML = '';

        const filtered = doctors.filter(d => {
            const matchesSpec = d.specialization === spec;
            const matchesLocation = location === '' || (d.location || '').toLowerCase().includes(location);
            return matchesSpec && matchesLocation;
        });

        if (filtered.length === 0) {
            const opt = document.createElement('option');
            opt.text = 'No doctors match this specialization/location';
            opt.disabled = true;
            opt.selected = true;
            doctorSelect.add(opt);
            return;
        }

        const placeholder = document.createElement('option');
        placeholder.text = 'Select doctor';
        placeholder.value = '';
        placeholder.disabled = true;
        placeholder.selected = true;
        doctorSelect.add(placeholder);

        filtered.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.name;
            opt.text = `${d.name} (${d.location || 'Location not set'})`;
            doctorSelect.add(opt);
        });
    }

    specializationSelect.addEventListener('change', populateDoctors);
    locationInput.addEventListener('input', populateDoctors);

    // initialize doctor list if specialization is already preselected
    if (specializationSelect.value) {
        populateDoctors();
    }

    // set min date for date input to today's date
    document.addEventListener('DOMContentLoaded', function(){
        const dateInput = document.getElementById('appt_date');
        if (dateInput) {
            const today = new Date().toISOString().split('T')[0];
            dateInput.setAttribute('min', today);
        }
    });
</script>

{% endblock %}
