{% extends 'base.html' %}

{% block content %}
<h2>Edit Appointment</h2>
<form method="POST">
    {{ csrf_input() }}
    <div class="mb-3">
        <label class="form-label">Patient Name</label>
        <input type="text" class="form-control" value="{{ appointment.patient_name }}" disabled>
    </div>
    <div class="mb-3">
        <label class="form-label">Patient Email</label>
        <input type="email" class="form-control" value="{{ appointment.patient_email }}" disabled>
    </div>
    <div class="mb-3">
        <label class="form-label">Appointment Date</label>
        <input type="date" class="form-control" name="date" value="{{ appointment.appointment_date }}" required aria-label="Appointment date">
    </div>
    <div class="mb-3">
        <label class="form-label">Location</label>
        <input type="text" class="form-control" name="location" value="{{ appointment.location }}" required aria-label="Appointment location">
    </div>
    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
            <option value="scheduled" {% if appointment.status == 'scheduled' %}selected{% endif %}>Scheduled</option>
            <option value="completed" {% if appointment.status == 'completed' %}selected{% endif %}>Completed</option>
            <option value="cancelled" {% if appointment.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Doctor Notes</label>
        <textarea class="form-control" name="notes" rows="4">{{ appointment.notes }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('doctor_dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
