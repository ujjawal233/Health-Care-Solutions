{% extends 'base.html' %}

{% block content %}
<h2>Edit Appointment</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Patient Name</label>
        <input type="text" class="form-control" value="{{ appointment[1] }}" disabled>
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" value="{{ appointment[2] }}" disabled>
    </div>
    <div class="mb-3">
        <label class="form-label">Doctor</label>
        <input type="text" class="form-control" value="{{ appointment[3] }}" disabled>
    </div>
    <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" class="form-control" name="date" value="{{ appointment[4] }}" required aria-label="Appointment date">
    </div>
    <div class="mb-3">
        <label class="form-label">Location</label>
        <input type="text" class="form-control" name="location" value="{{ appointment[5] }}" required aria-label="Appointment location">
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/doctor_dashboard" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
